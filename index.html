<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex 每日研究报告</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }
  .header { background: #1a3a6b; color: white; padding: 16px 20px; position: sticky; top: 0; z-index: 10; }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header p { font-size: 12px; opacity: 0.8; margin-top: 2px; }
  .container { max-width: 800px; margin: 0 auto; padding: 16px; }
  .date-badge { background: #e8f0fe; color: #1a3a6b; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; display: inline-block; margin-bottom: 16px; }
  .report-card { background: white; border-radius: 12px; padding: 18px; margin-bottom: 14px; border-left: 4px solid #1a3a6b; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .report-tag { font-size: 11px; background: #e8f0fe; color: #1a3a6b; padding: 2px 8px; border-radius: 4px; display: inline-block; margin-bottom: 8px; }
  .report-title { font-size: 15px; font-weight: 600; margin-bottom: 10px; color: #1a3a6b; }
  .report-content { font-size: 13px; line-height: 1.7; white-space: pre-wrap; color: #444; }
  .copy-btn { float: right; font-size: 12px; padding: 4px 12px; border-radius: 6px; border: 1px solid #1a3a6b; background: transparent; color: #1a3a6b; cursor: pointer; margin-top: -4px; }
  .copy-btn:hover { background: #1a3a6b; color: white; }
  .copy-btn.copied { background: #1a3a6b; color: white; }
  .empty { text-align: center; padding: 60px 20px; color: #999; }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .footer { text-align: center; font-size: 11px; color: #999; padding: 20px; margin-top: 10px; }
  .last-updated { font-size: 11px; color: #999; margin-bottom: 16px; }
</style>
</head>
<body>

<div class="header">
  <h1>📊 Apex 每日研究报告</h1>
  <p>Apex Securities Berhad — 中文翻译版</p>
</div>

<div class="container">
  <div id="content">
    <div class="empty">
      <div class="empty-icon">📭</div>
      <p>今日报告尚未更新</p>
      <p style="font-size:12px;margin-top:6px;">每个交易日 8:05am 自动更新</p>
    </div>
  </div>
  <div class="footer">
    翻译仅供个人参考 · 版权归 Apex Securities Berhad 所有 · 投资需谨慎
  </div>
</div>

<script>
async function loadReports() {
  try {
    const res = await fetch('reports.json?t=' + Date.now());
    if (!res.ok) return;
    const data = await res.json();
    if (!data.reports || data.reports.length === 0) return;

    const container = document.getElementById('content');
    let html = '';

    html += `<div class="date-badge">📅 ${data.date} · 共 ${data.reports.length} 份报告</div>`;
    html += `<div class="last-updated">最后更新：${data.updated}</div>`;

    data.reports.forEach((r, i) => {
      html += `
      <div class="report-card">
        <button class="copy-btn" onclick="copyReport(${i})">复制</button>
        <div class="report-tag">${r.type || '研究报告'}</div>
        <div class="report-title">${r.title}</div>
        <div class="report-content" id="report-${i}">${r.content}</div>
      </div>`;
    });

    container.innerHTML = html;
  } catch(e) {
    console.log('No reports yet');
  }
}

function copyReport(i) {
  const content = document.getElementById('report-' + i).innerText;
  navigator.clipboard.writeText(content).then(() => {
    const btn = document.querySelectorAll('.copy-btn')[i];
    btn.textContent = '已复制 ✓';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 2000);
  });
}

loadReports();
</script>
</body>
</html>
